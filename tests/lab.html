<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Still — Firefox scroll test lab</title>
<style>
body { margin: 0; font: 16px/1.5 system-ui; background: #f5f8f6; color: #173a2e; }
header { padding: 10px 18px; background: #d9eee3; }
button { padding: 8px 12px; margin: 3px; cursor: pointer; }
#results { height: 130px; overflow: auto; margin: 8px 18px; white-space: pre-wrap; font: 13px/1.4 monospace; }
[data-scroll-root] { height: 430px; overflow-y: auto; border: 2px solid #176348; margin: 12px 18px; scroll-behavior: smooth; }
#turns { padding: 24px; }
section { padding: 12px; }
.nested { overflow: auto; height: 100px; width: 300px; border: 1px solid; }
.nested > div { height: 600px; width: 1200px; }
#thread-bottom-container { position: sticky; bottom: 0; background: #d9eee3; padding: 6px 14px; }
#input { min-height: 30px; border: 1px solid #698; background: white; color: black; padding: 4px; }
#outside { height: 75px; overflow-y: scroll; margin: 12px 18px; border: 1px dashed; }
#outside > div { height: 500px; }
</style>
<header><strong>Still: real-browser regression lab</strong><br>
<button id="run">Run automated checks</button>
<button id="place">Place at section 40 (test setup)</button>
<button id="storm">Start 15-second scroll storm</button>
<span id="position"></span></header>
<pre id="results" aria-live="polite">Ready. This page has 120 long sections. Its own test driver attempts scrolling.</pre>
<div class="fixed"><div id="toc-harness">
  <button data-toc-item-index="0" id="rail-nav">Prompt 1 (compact navigation)</button>
  <div class="popover" aria-hidden="false">
    <button class="__menu-item" id="prompt-nav">Navigate to prompt (immediate)</button>
    <button class="__menu-item" id="delayed-nav">Navigate to prompt (250 ms delay)</button>
    <button class="__menu-item" id="expired-nav">Expired navigation (1200 ms delay)</button>
  </div>
</div></div>
<div class="popover" aria-hidden="false"><button class="__menu-item" id="unrelated-menu">Unrelated menu (must not jump)</button></div>
<div data-scroll-root tabindex="0">
  <main id="main"><div id="thread"><div id="turns"></div>
    <div id="thread-bottom-container">
      <div style="--thread-scroll-to-bottom-banner-offset:0px"><button aria-hidden="true" tabindex="-1" id="native-bottom">↓ Bottom</button></div>
      <div id="input" contenteditable="true" role="textbox" aria-label="Test composer">Type here</div>
      <button id="send">Send (must not jump)</button>
    </div>
  </div></main>
</div>
<div id="outside"><div>Unrelated panel: its own programmatic scrolling must still work.</div></div>
<script src="lab.js"></script>
<script src="../extension/guard.js"></script>
</html>
